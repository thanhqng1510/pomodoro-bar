name: Publish Release

# Triggered by pushing a tag like `v0.0.1`. Builds the macOS app on a macOS 26
# runner, then a separate job creates the GitHub Release and attaches the binary.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # release job needs to create the release and upload assets

jobs:
  #################### Job 1: BUILD ####################
  build:
    runs-on: macos-26 # macOS 26 / Xcode 26 SDK for Liquid Glass
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          # v0.0.1 -> 0.0.1
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stamp version into source
        run: |
          # The tag is the single source of truth: rewrite AppVersion.swift and
          # MARKETING_VERSION in project.pbxproj before building.
          ./set-version.sh "$VERSION"

      - name: Verify runner SDK
        run: xcodebuild -version && xcode-select -p

      - name: Build Release
        run: xcodebuild -scheme PomodoroBar -configuration Release build \
              CODE_SIGNING_ALLOWED=NO -derivedDataPath build

      - name: Verify bundle version matches tag
        run: |
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            build/Build/Products/Release/PomodoroBar.app/Contents/Info.plist)
          [ "$built" = "$VERSION" ] || { echo "::error::app version $built != tag $VERSION"; exit 1; }

      - name: Stage, sign, and zip app
        run: |
          mkdir -p dist
          cp -R build/Build/Products/Release/PomodoroBar.app dist/
          codesign --force --sign - --deep dist/PomodoroBar.app
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PomodoroBar.app "dist/PomodoroBar-$VERSION.zip"
          shasum -a 256 "dist/PomodoroBar-$VERSION.zip" > dist/checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/

  #################### Job 2: RELEASE ####################
  release:
    runs-on: ubuntu-latest
    needs: build # starts only after the build job succeeds
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/* # zip + checksums.txt
          generate_release_notes: true # auto notes from commits/PRs